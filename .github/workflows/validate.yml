name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    name: Source and Storybook
    # Playwright 1.58.2 supports Noble; ubuntu-latest has moved to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      - run: corepack pnpm build:storybook
      - run: corepack pnpm test:feature-budgets
      - run: corepack pnpm typecheck
      - run: corepack pnpm docs:check
      - run: corepack pnpm lint
      - run: corepack pnpm test:coverage
      - run: corepack pnpm test:workspace
      - run: corepack pnpm --filter @payload-inplace/acceptance exec playwright install --with-deps chromium
      - run: corepack pnpm test:storybook
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation-source
          path: test-results
  native:
    name: Native Payload and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      - run: node --test tests/tooling/demo-*.test.mjs
      - run: corepack pnpm test:int
      - run: corepack pnpm --filter @payload-inplace/acceptance exec playwright install --with-deps chromium firefox webkit
      - name: Validate review and toolbar without transactional revision metadata
        timeout-minutes: 6
        env:
          VE_BROWSER_ARTIFACTS: mongo
          VE_PORT: 3139
          VE_NEXT_DIST_DIR: .next-mongo
          VE_PRODUCTION: "1"
        run: |
          TMPDIR=$(mktemp -d "$RUNNER_TEMP/pve-mongo.XXXXXX")
          trap 'rm -rf -- "$TMPDIR"' EXIT
          export TMPDIR VE_RUN_ID=mongo-ci VE_RUN_STATE="$TMPDIR/launcher.json"
          corepack pnpm test:e2e tests/browser/acceptance.e2e.spec.ts --grep 'media selection persists'

          shopt -s nullglob
          leftovers=("$TMPDIR"/payload-ve-media-* "$TMPDIR"/payload-ve-mongo-*)
          if [[ -e "$VE_RUN_STATE" || ${#leftovers[@]} -ne 0 ]]; then
            printf 'Demo launcher did not clean up its run state or temporary resources in %s\n' "$TMPDIR" >&2
            exit 1
          fi
          if ( : > /dev/tcp/127.0.0.1/"$VE_PORT" ) 2>/dev/null; then
            printf 'Demo server is still listening on port %s\n' "$VE_PORT" >&2
            exit 1
          fi
      - name: Verify inline editing in Chromium, Firefox and WebKit
        env:
          VE_BROWSER_ARTIFACTS: inline-engines
          VE_PORT: 3140
          VE_NEXT_DIST_DIR: .next-inline-engines
        run: corepack pnpm test:e2e:inline-engines
      - run: VE_PORT=3137 corepack pnpm exec node scripts/postgres-test.mjs e2e
      - run: corepack pnpm test:graph
      - run: corepack pnpm exec node scripts/postgres-test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation-native
          path: test-results
  package:
    name: Packed consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      - run: corepack pnpm release:check
      - run: corepack pnpm pack:check
      - run: corepack pnpm test:consumer
      - run: corepack pnpm test:package-types
      - run: corepack pnpm --filter @payload-inplace/acceptance exec playwright install --with-deps chromium
      - run: corepack pnpm test:installed-consumer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          # prepare-release.mjs downloads this exact artifact from successful main runs.
          name: validation
          path: |
            test-results
            *.tgz
  validate:
    needs: [source, native, package]
    # A skipped required check does not block merges. Evaluate all lane results.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation lane to succeed
        env:
          LANE_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$LANE_RESULTS"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$LANE_RESULTS" > /dev/null
