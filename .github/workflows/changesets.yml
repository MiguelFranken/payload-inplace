name: changesets
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2, bundled Node 24 action
        with:
          version-script: corepack pnpm version:packages
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          github-token: ${{ github.token }}
          create-github-releases: false
          push-git-tags: false
# No publish command here: release.yml alone publishes the exact CI artifact
# after independent installed-consumer and Workshops acceptance receipts.
