name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      - run: corepack pnpm typecheck
      - run: corepack pnpm lint
      - run: corepack pnpm test:unit
      - run: corepack pnpm test:int
      - run: corepack pnpm pack:check
      - run: corepack pnpm test:consumer
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: corepack pnpm test:e2e:prod
      - run: corepack pnpm exec node scripts/postgres-test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation
          path: test-results
