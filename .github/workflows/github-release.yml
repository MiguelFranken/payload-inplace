name: Publish GitHub Release
on:
  workflow_call:
    inputs:
      validation_run:
        required: true
        type: string
      archive_sha256:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      validation_run:
        description: Successful main push validation run ID of the published archive
        required: true
        type: string
      archive_sha256:
        description: SHA256 of the published archive
        required: true
        type: string
permissions: {}
concurrency:
  group: github-release
  cancel-in-progress: false
jobs:
  github-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify the npm archive and publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: node scripts/github-release.mjs
